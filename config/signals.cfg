# signals.cfg — signal ownership and conditioning
#
# [signals]
# signal_name = owner_service
#
# [conditioning]
# signal_name = invert | scale=N | invert scale=N
#
# Signals written by IOBus drivers (hardware inputs) are owned by pci.iobus.
# Signals written by external services are owned by that service.
# Non-owner writes are rejected.

[signals]

# detector inputs (written by driver inside pci.iobus)
det.0  = pci.iobus
det.1  = pci.iobus
det.2  = pci.iobus
det.3  = pci.iobus

# confirm inputs
conf.0 = pci.iobus
conf.1 = pci.iobus

# controller ready bit
crb    = pci.iobus

# ── stream 0 outputs (written by MOVA kernel stream 0) ───────────────────────

# stage force outputs (force.N → stage N+1)
force.0    = pci.mova.kernel@0
force.1    = pci.mova.kernel@0
force.2    = pci.mova.kernel@0
force.3    = pci.mova.kernel@0

# turn-on, hold inhibit, sync pulse
to         = pci.mova.kernel@0
hi         = pci.mova.kernel@0
sync       = pci.mova.kernel@0

# fault outputs
det_fault  = pci.mova.kernel@0
mova_fault = pci.mova.kernel@0

# special outputs (dataset-configurable channel outputs)
special.0  = pci.mova.kernel@0
special.1  = pci.mova.kernel@0
special.2  = pci.mova.kernel@0
special.3  = pci.mova.kernel@0
special.4  = pci.mova.kernel@0
special.5  = pci.mova.kernel@0
special.6  = pci.mova.kernel@0
special.7  = pci.mova.kernel@0

[conditioning]
# example: active-low detector — uncomment to invert
# det.0 = invert

[sim]
# steady = holds at 1   pulse = random on/off (default)
crb    = steady
conf.0 = steady
conf.1 = steady
