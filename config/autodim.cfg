[autodim]
# Enable/disable the dimming service
enabled = true

# Site coordinates (WGS84 decimal degrees)
lat = 51.5074
lon = -0.1278

# Minutes offset from astronomical sunset/sunrise
# dim_offset_minutes: positive = later than sunset, negative = earlier
# bright_offset_minutes: positive = later than sunrise, negative = earlier
dim_offset_minutes    = 0
bright_offset_minutes = 0

# IOBus output signal to write (must be owned by pci.autodim in signals.cfg)
# 1 = dim, 0 = bright
signal = virt.dim
