# ports.cfg — PCI platform port assignments
# Systemd units read these via environment variables set in the unit files.
# This file is a reference — services fall back to compiled defaults.
#
# On this dev host: 8080 = /opt/MOVA, 6000-6007 = /opt/MOVA AML, 161 UDP = CM5 UG405
# Field CM5: 8080 free, 161 free — update systemd units before deployment.

[web]
port = 8082

[rtig]
http_port = 9011

[mova]
# AML base port; stream N listens on base_port + N
# 6000-6007 occupied on dev host by /opt/MOVA
aml_base_port = 6010

[ug405]
# 161 UDP occupied on dev host by CM5 ug405
# Use 1161 on dev; set to 161 on field CM5 (set PCI_UG405_SNMP_PORT=161 in unit)
snmp_port = 1161
