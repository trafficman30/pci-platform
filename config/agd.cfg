# AGD650 radar detector configuration.
# Each [AGD.N] section is one physical unit.
# Zone numbers may overlap across units — use unit-qualified keys in [VIRT_MAPPING].
# Override path: PCI_AGD_CFG=/path/to/agd.cfg
# Simulator: python /opt/CM5/agd/agd.py --port 9003

[AGD.1]
ip    = 127.0.0.1
port  = 9003
zones = 1,2,3,4

[SETTINGS]
frame_timeout = 5.0

[CLASSES]
car        = has_car
pedestrian = has_pedestrian
bus        = has_bus
lorry      = has_lorry
cyclist    = has_cyclist

[VIRT_MAPPING]
# Deployment-specific: map unit/zone/type to owned IOBus signals.
# Signals must be declared in config/signals.cfg as owned by pci.agd.
# Unit-qualified format (preferred when multiple units share zone numbers):
#   agd.1.zone.1.detected    = agd.i.1
#   agd.1.zone.1.has_car     = agd.i.2
# Global fallback (when zone numbers are unique across all units):
#   zone.1.detected          = agd.i.1
#
# Global OR bits (optional):
#   any_detected             = agd.i.100
#   any_car                  = agd.i.101
