# FLIR camera configuration.
# Each [CAMERA.N] section is one physical camera.
# ip + port define the WebSocket endpoint (ws://<ip>:<port>).
# Override path: PCI_FLIR_CFG=/path/to/flir.cfg
# Mock server: python /opt/CM5/flir/flir_mock_server.py --port 8765

[CAMERA.1]
ip    = 127.0.0.1
port  = 8765
zones = 1,2,3

[VIRT_MAPPING]
# Deployment-specific: map camera/zone/type to owned IOBus signals.
# Signals must be declared in config/signals.cfg as owned by pci.flir.
# Camera-qualified format (preferred when multiple cameras share zone numbers):
#   camera.1.zone.1.occupied     = flir.i.1
#   camera.1.zone.1.dilemma      = flir.i.2
# Global fallback:
#   zone.1.occupied              = flir.i.1
#
# Zone types: occupied, dilemma, has_pedestrian, has_bicycle, has_vehicle
#
# Global OR bits (optional):
#   any_occupied                 = flir.i.100
#   any_dilemma                  = flir.i.101
#   any_pedestrian               = flir.i.102
#   any_bicycle                  = flir.i.103
#   any_vehicle                  = flir.i.104
