# platform.cfg — controls which driver and services are active

[iobus]
# sim | xkop | rpdb | gpio — leave blank for no driver
driver = sim

[xkop]
ip   = 127.0.0.1
port = 8001
mode = client

[mova]
# comma-separated stream indices to connect to
streams = 0

[services]
mova    = enabled
ug405   = disabled
rtig    = disabled
autodim = disabled
offline = disabled
web     = enabled
