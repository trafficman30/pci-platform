# config/ug405.cfg — UG405 SCN signal mapping
#
# Each [SCN] block defines one Signal Controller Node.
# Signal names must match entries in config/signals.cfg.
#
# Control signals (utcControl*) are written by pci.ug405 to IOBus.
# Reply signals (utcReply*) are read by pci.ug405 from IOBus.
# Prefix a reply signal with ! to logically invert its value.
#
# Bit-mapped fields use [N] notation (bit 1 = LSB of the byte).
# Supported control fields:  DX Dn Fn SFn PV PX SO SG LO LL TS FM TO HI CP EP GO FF MO
# Supported reply fields:    Gn GX DF FC SCn HC WI PC PR CG GR1 SDn MC CF LE RR LFn
#                            RF1 RF2 EV VC VQ CA CR CL CSn TF VSn VO CO EC CS FR BDn
#                            TPn SB LC MR MF ML GPn
#
# [SERVICES] controls service behaviour.
# [LIVE] is managed by the service — do not edit by hand.
#
# Deployment: add one [SCN] block per junction SCN.
# Add corresponding signal ownership to config/signals.cfg:
#   xkop.o.101 = pci.ug405    (control signals)
#   xkop.i.101 = pci.iobus    (reply signals, written by drivers)

[SERVICES]
scoot_inform_on_change_only = true
clock_jitter_check          = disabled
clock_jitter_grace          = 60
io_fault_timeout            = 30

# SCN blocks below copied from CM5 deployment as working example.
# Signal names (xkop.i/o.*, virt.*) are deployment-specific — adjust per site.
# Control signals must be declared in signals.cfg as owned by pci.ug405.
# Reply signals must be declared in signals.cfg as owned by pci.iobus.
# Inversion syntax: append ! to the field name, e.g. utcReplyGn[1]! = xkop.i.12

[SCN]
name = X0330
utcReplyVSn[1]    = xkop.i.0
utcReplyVSn[2]    = xkop.i.2
utcReplyVSn[3]    = xkop.i.3
utcReplyVSn[4]    = xkop.i.5
utcReplyVSn[5]    = xkop.i.6
utcReplyVSn[6]    = xkop.i.8
utcReplyVSn[7]    = xkop.i.10
utcReplyVSn[8]    = virt.501

[SCN]
name = J0331
utcReplyGn[1]   != xkop.i.12
utcReplyGn[2]   != xkop.i.13
utcReplyGn[3]   != xkop.i.14
utcReplySDn[2]    = xkop.i.16
utcReplySDn[3]    = xkop.i.17
utcReplyMC        = xkop.i.21
utcReplyLFn[1]  != xkop.i.22
utcReplyGPn[1]    = xkop.i.23
utcReplyCF        = xkop.i.24
utcReplyDF        = xkop.i.25
utcReplyCS        = xkop.i.26
utcReplyRR        = xkop.i.27
utcReplyGn[4]     = xkop.i.15
utcReplySDn[4]    = xkop.i.18

utcControlFn[1]   = xkop.o.1
utcControlFn[2]   = xkop.o.2
utcControlFn[3]   = xkop.o.3
utcControlDn[2]   = xkop.o.5
utcControlDn[3]   = xkop.o.6
utcControlMO      = xkop.o.10
utcControlDX      = xkop.o.14
utcControlTS      = xkop.o.15
utcControlSO      = xkop.o.16
utcControlFn[4]   = xkop.o.4
utcControlDn[4]   = xkop.o.7
utcControlGO      = virt.199

[SCN]
name = J0332
utcReplyGn[1]   != xkop.i.32
utcReplyGn[2]   != xkop.i.33
utcReplyGn[3]   != xkop.i.34
utcReplyGn[4]   != xkop.i.35
utcReplySDn[2]    = xkop.i.36
utcReplySDn[3]    = xkop.i.37
utcReplySDn[4]    = xkop.i.38

utcControlFn[1]   = xkop.o.21
utcControlFn[2]   = xkop.o.22
utcControlFn[3]   = xkop.o.23
utcControlFn[4]   = xkop.o.24
utcControlDn[2]   = xkop.o.25
utcControlDn[3]   = xkop.o.26
utcControlDn[4]   = xkop.o.27
utcControlGO      = xkop.o.30

[SCN]
name = J0333
utcReplyGn[1]     = virt.411
utcReplyGn[2]     = virt.412

utcControlFn[1]   = virt.510
utcControlFn[2]   = virt.511

[SCN]
name = MICK_VC
utcReplyVC        = virt.461
