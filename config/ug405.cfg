# config/ug405.cfg — UG405 SCN signal mapping
#
# Each [SCN] block defines one Signal Controller Node.
# Signal names must match entries in config/signals.cfg.
#
# Control signals (utcControl*) are written by pci.ug405 to IOBus.
# Reply signals (utcReply*) are read by pci.ug405 from IOBus.
# Prefix a reply signal with ! to logically invert its value.
#
# Bit-mapped fields use [N] notation (bit 1 = LSB of the byte).
# Supported control fields:  DX Dn Fn SFn PV PX SO SG LO LL TS FM TO HI CP EP GO FF MO
# Supported reply fields:    Gn GX DF FC SCn HC WI PC PR CG GR1 SDn MC CF LE RR LFn
#                            RF1 RF2 EV VC VQ CA CR CL CSn TF VSn VO CO EC CS FR BDn
#                            TPn SB LC MR MF ML GPn
#
# [SERVICES] controls service behaviour.
# [LIVE] is managed by the service — do not edit by hand.
#
# Deployment: add one [SCN] block per junction SCN.
# Add corresponding signal ownership to config/signals.cfg:
#   xkop.o.101 = pci.ug405    (control signals)
#   xkop.i.101 = pci.iobus    (reply signals, written by drivers)

[SERVICES]
scoot_inform_on_change_only = true
clock_jitter_check          = disabled
clock_jitter_grace          = 60
io_fault_timeout            = 30

# Example SCN — uncomment and configure for deployment.
# Signal names must exist in config/signals.cfg.
#
# [SCN]
# name              = J001
#
# # Demand bits (utcControlDn) — instation writes to tell TLC which stages to demand
# utcControlDn[1]   = xkop.o.101
# utcControlDn[2]   = xkop.o.102
# utcControlDn[3]   = xkop.o.103
# utcControlDn[4]   = xkop.o.104
#
# # Force bits (utcControlFn) — instation writes to force specific stages
# utcControlFn[1]   = xkop.o.105
# utcControlFn[2]   = xkop.o.106
#
# # Green reply bits (utcReplyGn) — which stages are currently showing green
# utcReplyGn[1]     = xkop.i.101
# utcReplyGn[2]     = xkop.i.102
# utcReplyGn[3]     = xkop.i.103
# utcReplyGn[4]     = xkop.i.104
#
# # SCOOT detector occupancy (utcReplyVSn) — sampled at 100ms, nibble-packed
# utcReplyVSn[1]    = xkop.i.111
# utcReplyVSn[2]    = xkop.i.112
# utcReplyVSn[3]    = xkop.i.113
# utcReplyVSn[4]    = xkop.i.114
#
# # Inverted reply example — signal is active-low, invert for SNMP reply
# # utcReplyFC!       = xkop.i.120
