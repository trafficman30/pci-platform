# rtig.cfg — pci.rtig configuration

[rtig]
pulse_seconds = 2.0
rules_file    = rtig_rules.json

[signal_map]
# Logical names used in rtig_rules.json → actual IOBus signal names
# RTIG1 = xkop.o.109 means rule "signal: RTIG1" fires xkop.o.109
# Copied from CM5 deployment as working example — adjust signal names per site.
RTIG1 = virt.10
RTIG2 = virt.11
RTIG3 = virt.12
RTIG4 = virt.13
RTIG5 = virt.14
