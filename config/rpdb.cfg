# rpdb.cfg — RPDB IO driver configuration
#
# Subscription behaviour (PTC-1 firmware constraint):
#   on-change (0x10) is NOT supported — returns UNSUPPORTED_COMMAND.
#   on-time (0x11) pushes on value change AND heartbeat every N ticks.
#   1 tick = 100ms.  ticks=600 = push on change + heartbeat every 60s.
#   This is the confirmed recommended setting for all parameters.
#
# Signal registration:
#   Input signals (rpdb.i.*) are registered automatically at startup
#   by querying element counts from the controller. No pre-registration
#   in signals.cfg required for inputs — the driver registers them.
#
#   Output signals (rpdb.o.*) must be declared in signals.cfg with
#   their owner service. The driver discovers them by scanning signals.cfg
#   and resolves them to URI + element index via the name maps below.
#   Static outputs (OUTPUTS section) bypass name map resolution entirely.

[RPDB]
host           = 192.168.71.101
port           = 35340
username       = user
password       = Peek
write_password = 3145

[SUBSCRIBE]
# parameter = bus_prefix , ticks
# ticks=600: push on change + heartbeat every 60s (confirmed PTC-1 behaviour)
XSG.CSC  = rpdb.i.xsg  , 600
XOUT.CSC = rpdb.i.xout , 600
XDET.STS = rpdb.i.xdet , 600

[NAMES]
# parameter = name_parameter
# Fetched once at startup via GET_TEXT to map element index to friendly name.
# Used for debug logging and output signal resolution only.
# Omit if no name parameter is available for a subscription.
XSG.CSC  = XSG.I
XOUT.CSC = XOUT.I
XDET.STS = XDET.I

[OUTPUTS]
# Write-only Par DB mappings — no subscription needed.
# format: bus_signal = PARDB_PARAM , element_index
#
# Signals here bypass name map resolution — URI and index are explicit.
# The bus_signal must also appear in signals.cfg owned by its service.
#
# Example — virtual inputs (UTC control or conditioner writes):
# rpdb.o.vin.0 = VIRTUAL_IN , 0
# rpdb.o.vin.1 = VIRTUAL_IN , 1
